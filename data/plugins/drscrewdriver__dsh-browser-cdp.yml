url: https://github.com/drscrewdriver/dsh-browser-cdp
name: drscrewdriver/dsh-browser-cdp
category: browser
description:
  en: 'Browser automation over CDP: attach to a running Chrome/Edge or let the plugin manage an ego-lite Chromium, drive it with 38 structured bcdp_* tools (navigate, click, fill, snapshot, wait, download, login import), and watch every page live — SSE screencast, direct mouse/keyboard takeover, captcha notice, and click-to-pick element capture that quotes the picked element into the chat input; docks as a dsh-better-sidebar tab or floats as a watch ball.'
  zh: 'CDP 浏览器代理：接管运行中的 Chrome/Edge，或托管启动 ego-lite Chromium，以 38 个结构化 bcdp_* 工具（导航、点击、填写、快照、等待、下载捕获、登录态导入）驱动浏览。实时观察窗经 SSE 推流展示 agent 正在看的每个页面，可直接鼠标键盘接管；点选画面元素即捕获其定位与语义描述，以结构化块引用进对话输入框。装了 dsh-better-sidebar 时入驻侧边栏标签，否则退为浮动观察球。'
